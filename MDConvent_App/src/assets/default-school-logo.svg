<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="94" fill="url(#crestGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />

  <!-- Inner Circle Shield -->
  <circle cx="100" cy="100" r="76" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Stars of Excellence -->
  <g fill="#fbbf24">
    <!-- Center Top Star -->
    <path d="M 100 32 L 102 38 L 108 38 L 103 42 L 105 48 L 100 44 L 95 48 L 97 42 L 92 38 L 98 38 Z" />
    <!-- Left Star -->
    <path d="M 68 44 L 69.5 48.5 L 74 48.5 L 70.5 51.5 L 72 56 L 68 53 L 64 56 L 65.5 51.5 L 62 48.5 L 66.5 48.5 Z" />
    <!-- Right Star -->
    <path d="M 132 44 L 133.5 48.5 L 138 48.5 L 134.5 51.5 L 136 56 L 132 53 L 128 56 L 129.5 51.5 L 126 48.5 L 130.5 48.5 Z" />
  </g>

  <!-- Graduation Cap (Mortarboard) -->
  <g id="grad-cap" transform="translate(100, 78)">
    <!-- Cap Diamond Top -->
    <polygon points="0,-18 42,-3 0,12 -42,-3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <!-- Cap Skull Base -->
    <path d="M -22,4 L -22,14 C -22,23 22,23 22,14 L 22,4 Z" fill="#cbd5e1" />
    <!-- Tassel Button -->
    <circle cx="0" cy="-3" r="3" fill="#fbbf24" />
    <!-- Tassel Ribbon & Fringe -->
    <path d="M 0,-3 C 18,3 28,12 30,22" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    <polygon points="28,22 32,22 33,30 27,30" fill="#fbbf24" />
  </g>

  <!-- Open Book Symbol of Knowledge -->
  <g id="open-book" transform="translate(100, 134)" fill="#ffffff" stroke="#0f172a" stroke-linejoin="round">
    <!-- Spine Central Base -->
    <path d="M 0,-18 L 0,8" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <!-- Left Page -->
    <path d="M 0,-16 C -18,-24 -36,-22 -46,-16 L -46,6 C -36,0 -18,-2 0,6 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Right Page -->
    <path d="M 0,-16 C 18,-24 36,-22 46,-16 L 46,6 C 36,0 18,-2 0,6 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Page Ruling Lines (Left) -->
    <line x1="-10" y1="-10" x2="-38" y2="-6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-10" y1="-3" x2="-38" y2="1" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-10" y1="4" x2="-34" y2="7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <!-- Page Ruling Lines (Right) -->
    <line x1="10" y1="-10" x2="38" y2="-6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="10" y1="-3" x2="38" y2="1" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="10" y1="4" x2="34" y2="7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Laurel / Olive Garland Base -->
  <g fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.85">
    <path d="M 45 140 C 40 156 55 168 75 171" />
    <path d="M 155 140 C 160 156 145 168 125 171" />
    <circle cx="100" cy="172" r="3" fill="#fbbf24" />
  </g>
</svg>
